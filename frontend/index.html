<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Habrivo AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      transition: .3s;
    }

    body.dark {
      background: #111827;
      color: white;
    }

    .topbar {
      max-width: 900px;
      margin: 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
    }

    body.dark .container {
      background: #1f2937;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 10px 18px;
      color: white;
      background: #2563eb;
    }

    #loginBtn {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    #saveBtn {
      background: #2563eb;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .stat-card {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      text-align: center;
      padding: 25px;
      border-radius: 14px;
    }

    .card {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    body.dark .card {
      background: #374151;
    }

    .card img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .edit-btn {
      background: #f59e0b;
    }

    .delete-btn {
      background: #dc2626;
    }

    .edit-btn {
      background: #f59e0b;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .msg-btn {
      background: #16a34a;
      color: white;
    }

    .msg-btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .msg-btn:hover {
      background: #16a34a;
    }

    @media(max-width:700px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }

    .login-box {
      max-width: 380px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
    }

    body.dark .login-box {
      background: #1f2937;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 230px;
      background: #1d4ed8;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      margin-bottom: 20px;
    }

    .menu {
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      background: transparent;
      border: none;
      color: white;
      text-align: left;
      cursor: pointer;
    }

    .menu.active,
    .menu:hover {
      background: rgba(255, 255, 255, .15);
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    body.dark .sidebar {
      background: #0f172a;
    }

    @media(max-width:768px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }
    }

    .msg-btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .msg-btn:hover {
      background: #16a34a;
    }

    .view-btn {
      background: #0ea5e9;
      color: white;
    }

    .view-btn:hover {
      background: #0284c7;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 450px;
      border-radius: 15px;
      padding: 20px;
    }

    .close {
      float: right;
      font-size: 28px;
      cursor: pointer;
    }

    .modal-content img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: auto;
    }
  </style>
</head>

<body>
  <div id="loginPage" class="login-box">

    <h2>🔐 Habrivo Admin Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" type="button" onclick="login()">Login</button>

  </div>

  <div id="app" style="display:none;">
    <div class="layout">

      <aside class="sidebar">
        <h2>🚀 Habrivo</h2>

        <button class="menu active">🏠 Dashboard</button>
        <button class="menu">🏢 Companies</button>
        <button class="menu">📊 Analytics</button>
        <button class="menu">⚙ Settings</button>

        <hr>

        <button onclick="toggleTheme()">🌙 Dark Mode</button>
      </aside>

      <main class="main">
        <button onclick="logout()" style="background:#dc2626;">
          🚪 Logout
        </button>
        <div class="topbar">
          <h1>Company Dashboard</h1>
        </div>

        <div class="container">
          <!-- Tumhara existing form aur cards yahin rahenge -->
        </div>

      </main>

    </div>

    <div class="container">

      <h2>Company Registration</h2>

      <input id="name" placeholder="Company Name">
      <input id="owner" placeholder="Owner Name">
      <input id="whatsapp" placeholder="WhatsApp Number">
      <input id="category" placeholder="Category">
      <input type="text" id="address" placeholder="Address">
      <input type="text" id="website" placeholder="Website (https://...)">

      <input type="file" id="logo" accept="image/*">
      <img id="preview" src=""
        style="display:none;width:90px;height:90px;border-radius:50%;object-fit:cover;margin:10px 0;">
      <button id="saveBtn" onclick="saveCompany()">Save</button>

      <div class="stats">
        <h3 style="margin-top:20px">Registration Trend</h3>

        <canvas id="chart" height="120"></canvas>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <div class="stat-card">
          <h2 id="totalCompanies">0</h2>
          <p>Companies</p>
        </div>

        <div class="stat-card">
          <h2 id="totalCategories">0</h2>
          <p>Categories</p>
        </div>

        <div class="stat-card">
          <h2 id="todayCount">0</h2>
          <p>Today</p>
        </div>
      </div>

      <input id="search" placeholder="🔍 Search Company" oninput="loadCompanies()">

      <hr style="margin:18px 0">
      <button onclick="exportExcel()" style="background:green;margin:10px 0;">
        📥 Export Excel
      </button>

      <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
      <h2>Registered Companies</h2>

      <div id="companies"></div>

    </div>

    <script>
      async function exportExcel() {

        const res = await fetch(`${API}/api/companies`);
        const companies = await res.json();

        const ws = XLSX.utils.json_to_sheet(companies);
        const wb = XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(wb, ws, "Companies");

        XLSX.writeFile(wb, "Habrivo_Companies.xlsx");

      }
      const API = "https://habrivo-ai.onrender.com";
      let editingId = null;

      function toggleTheme() {
        document.body.classList.toggle("dark");
      }
      document.getElementById("logo").addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      });

      async function loadCompanies() {
        const res = await fetch(API + "/api/companies", {
          credentials: "include"
        });
        const companies = await res.json();

        const search = document.getElementById("search").value.toLowerCase();
        const filtered = companies.filter(c =>
          (c.company || "").toLowerCase().includes(search) ||
          (c.owner || "").toLowerCase().includes(search) ||
          (c.category || "").toLowerCase().includes(search)
        );

        drawChart(filtered.length);
        document.getElementById("totalCompanies").innerText = filtered.length;
        document.getElementById("totalCategories").innerText =
          new Set(filtered.map(c => c.category)).size;
        document.getElementById("todayCount").innerText = filtered.length;

        const box = document.getElementById("companies");
        box.innerHTML = "";

        filtered.forEach(c => {
          box.innerHTML += `
    <div class="card">
        ${c.logo ? `<img src="${c.logo}" width="70" height="70">` : ""}

        <h3>${c.company || "-"}</h3>
        <p><b>Owner:</b> ${c.owner || "-"}</p>
        <p><b>WhatsApp:</b> ${c.whatsapp || "-"}</p>
        <p><b>Category:</b> ${c.category || "-"}</p>
        <p><b>Address:</b> ${c.address || "-"}</p>
<p><b>Website:</b> ${c.website
              ? `<a href="${c.website}" target="_blank">${c.website}</a>`
              : "-"
            }</p>
        <div class="actions">
           <button class="view-btn" onclick="viewCompany(${c.id})">View</button>
            <button class="edit-btn" onclick="editCompany(${c.id})">Edit</button>
            <button class="delete-btn" onclick="deleteCompany(${c.id})">Delete</button>
            <button class="msg-btn" onclick="window.open('https://wa.me/91${c.whatsapp}','_blank')">Message</button>
        </div>
    </div>`;
        });
      }
      async function editCompany(id) {
        try {
          const res = await fetch(API + "/api/companies", { credentials: "include" });
          if (!res.ok) throw new Error("Failed to load companies");

          const companies = await res.json();
          const c = companies.find(x => String(x.id) === String(id));

          if (!c) {
            alert("Company not found.");
            return;
          }

          editingId = id;
          document.getElementById("name").value = c.company || "";
          document.getElementById("owner").value = c.owner || "";
          document.getElementById("whatsapp").value = c.whatsapp || "";
          document.getElementById("category").value = c.category || "";
          document.getElementById("address").value = c.address || "";
          document.getElementById("website").value = c.website || "";

          if (c.logo) {
            const preview = document.getElementById("preview");
            preview.src = c.logo;
            preview.style.display = "block";
          }

          document.getElementById("saveBtn").innerText = "Update Company";
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (error) {
          console.error("Edit error:", error);
          alert("Unable to load company for editing.");
        }
      }

      async function viewCompany(id) {
        try {
          const res = await fetch(API + "/api/companies", { credentials: "include" });
          if (!res.ok) throw new Error("Failed to load companies");

          const companies = await res.json();
          const c = companies.find(x => String(x.id) === String(id));

          if (!c) {
            alert("Company not found.");
            return;
          }

          const website = c.website
            ? (c.website.startsWith("http") ? c.website : "https://" + c.website)
            : "";

          document.getElementById("modalBody").innerHTML = `
      ${c.logo ? `<img src="${c.logo}" alt="Company Logo">` : ""}
      <h2 style="text-align:center">${c.company || "-"}</h2>
      <hr>
      <p><b>Owner:</b> ${c.owner || "-"}</p>
      <p><b>WhatsApp:</b> ${c.whatsapp || "-"}</p>
      <p><b>Category:</b> ${c.category || "-"}</p>
      <p><b>Address:</b> ${c.address || "-"}</p>
      <p><b>Website:</b> ${c.website || "-"}</p>

      <button class="msg-btn"
        onclick="window.open('https://wa.me/91${c.whatsapp}','_blank')"
        style="width:100%;margin-top:15px;">
        WhatsApp
      </button>

      ${website ? `
        <button id="webBtn" class="view-btn"
          style="width:100%;margin-top:10px;">
          Visit Website
        </button>
      ` : ""}
    `;

          if (website) {
            document.getElementById("webBtn").onclick = () => {
              window.open(website, "_blank");
            };
          }

          document.getElementById("companyModal").style.display = "flex";
        } catch (error) {
          console.error("View error:", error);
          alert("Unable to load company details.");
        }
      }

      function closeModal() {
        document.getElementById("companyModal").style.display = "none";
      }
      async function saveCompany() {
        const name = document.getElementById("name").value;
        const owner = document.getElementById("owner").value;
        const whatsapp = document.getElementById("whatsapp").value;
        const category = document.getElementById("category").value;
        const address = document.getElementById("address").value;
        const website = document.getElementById("website").value;
        const logo = document.getElementById("logo").files[0];

        const formData = new FormData();
        formData.append("company", name);
        formData.append("owner", owner);
        formData.append("whatsapp", whatsapp);
        formData.append("category", category);
        formData.append("address", address);
        formData.append("website", website);

        if (logo) {
          formData.append("logo", logo);
        }
        const url = editingId
          ? `${API}/api/company/${editingId}`
          : `${API}/api/company`;

        const method = editingId ? "PUT" : "POST";

        const res = await fetch(url, {
          method: method,
          body: formData,
          credentials: "include"
        });
        const result = await res.json();

        if (result.success) {
          alert(editingId ? "Company Updated Successfully!" : "Company Saved Successfully!");
        } else {
          alert(result.message || "Operation Failed");
          return;
        }

        document.getElementById("name").value = "";
        document.getElementById("owner").value = "";
        document.getElementById("whatsapp").value = "";
        document.getElementById("category").value = "";
        document.getElementById("address").value = "";
        document.getElementById("website").value = "";
        document.getElementById("logo").value = "";
        document.getElementById("preview").style.display = "none";
        document.getElementById("preview").src = "";

        editingId = null;
        document.getElementById("saveBtn").innerText = "Save";

        loadCompanies();
      }

      async function deleteCompany(id) {
        if (!confirm("Are you sure you want to delete this company?")) return;

        try {
          const res = await fetch(API + "/api/company/" + id, {
            method: "DELETE",
            credentials: "include"
          });

          const result = await res.json();

          if (res.ok && result.success) {
            alert("Company deleted successfully.");
            await loadCompanies();
          } else {
            alert(result.message || "Delete failed.");
            console.error("Delete response:", result);
          }
        } catch (error) {
          console.error("Delete error:", error);
          alert("Server connection failed while deleting.");
        }
      }

      function drawChart(count) {

        console.log("Companies:", count);
      }
      async function checkAuth() {
        const r = await fetch(API + "/api/check-auth", {
          credentials: "include"
        });

        const d = await r.json();

        if (d.loggedIn) {
          document.getElementById("loginPage").style.display = "none";
          document.getElementById("app").style.display = "block";
          loadCompanies();
        }
      }

      checkAuth();
      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const r = await fetch(API + "/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({ email, password })
          });

          const d = await r.json();

          if (d.success) {
            document.getElementById("loginPage").style.display = "none";
            document.getElementById("app").style.display = "block";

            loadCompanies();
          } else {
            alert(d.message || "Login Failed");
          }

        } catch (error) {
          console.error("Login error:", error);
          alert("Server connection failed. Please try again.");
        }
      }


      async function logout() {
        try {
          await fetch(API + "/api/logout", {
            credentials: "include"
          });
        } catch (error) {
          console.error("Logout error:", error);
        }

        document.getElementById("app").style.display = "none";
        document.getElementById("loginPage").style.display = "block";
      }


      let chart;


      function drawChart(total) {
        const ctx = document.getElementById("chart");


        if (chart) chart.destroy();

        chart = new Chart(ctx, {
          type: "bar",
          data: {
            labels: ["Companies"],
            datasets: [{
              label: "Total Registered",
              data: [total]
            }]
          }
        });
      }

    </script>
  </div>
  <div id="companyModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>
</body>

</html>
